[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "curatarr"
version = "0.1.0"
description = "Telegram-first media request and library management assistant for Ryot, Radarr, Sonarr, and Jellyfin"
authors = [{name = "BrainPonders"}]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = ["httpx>=0.27,<1"]
browser-test = ["playwright>=1.50,<2"]

[project.scripts]
curatarr = "curatarr.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"curatarr.web" = ["static/*"]
