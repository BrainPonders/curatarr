name: Project checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  records-and-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[test]'
      - run: python maintainer/test/check_project_records.py
      - run: git diff --check
      - run: python -m unittest discover -s tests
        env:
          PYTHONPATH: src:tests
          PYTHONDONTWRITEBYTECODE: '1'
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[test,browser-test]'
      - run: python -m playwright install --with-deps chromium
      - run: python maintainer/test/browser_checks.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-browser-evidence
          path: .local/qa/browser
          include-hidden-files: true
          retention-days: 7
